[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fsku"
version = "0.9.0"
description = "FSKU: Open-Source GPU Compute Benchmark Index & Forward Curve Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "NativX", email = "research@nativx.net" }
]
keywords = ["gpu", "compute", "index", "derivatives", "forward-curve", "h100", "b200", "nativx", "fsku"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://nativx.net"
Repository = "https://github.com/nativ-x/fsku"
Issues = "https://github.com/nativ-x/fsku/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "reportlab>=4.0.0",
]

[project.scripts]
fsku = "fsku.cli.main:app"

[tool.setuptools.packages.find]
include = ["fsku*"]
